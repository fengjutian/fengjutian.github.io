# 网站收藏（/sites/ 页面的数据源）
#
# 每个条目在页面上渲染成一张卡片。以后加网站只需要往下追加，模板不用动：
#
# - name: 站点名          # 必填，卡片标题
#   url: https://...      # 必填，整张卡片可点击
#   description: 一句话    # 可选，说明这个站点为什么值得收藏
#   tags: [AI, 工具]      # 可选，卡片底部的小标签，同时用作页面顶部的筛选
#   icon: "◆"             # 可选，卡片左上角图标（emoji 或单字）；留空则取站名首字
#   logo: /assets/img/x.svg # 可选，优先于 icon；放一张方形图片当 logo
#
# 条目顺序就是页面顺序，常看的放前面。

- name: Anthropic
  url: https://www.anthropic.com/
  description: Claude 的官方发布与研究入口，模型能力和 agent 设计的一手资料。
  tags: [AI, 模型]
  icon: "A"

- name: Simon Willison's Weblog
  url: https://simonwillison.net/
  description: LLM 工具链最勤快的一手实践记录，新模型和新用法几乎当天就有评测。
  tags: [AI, 工具]
  icon: "S"

