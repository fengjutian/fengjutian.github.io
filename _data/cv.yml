# CV 数据源（rendercv 格式）。
#
# 这里只保留已经确认的信息——不填编造的履历。RenderCV 会在
# `assets/rendercv/rendercv_output/` 下生成 PDF，由 .github/workflows/render-cv.yml 提交。
#
# 补齐 Education / Experience / Projects / Skills 等段落后，
# 再把 _config.yml 的 exclude 里的 `_pages/cv.md` 删掉，即可发布 /cv/ 页面。
cv:
  name: Fengjutian
  label: 独立开发者
  email: fengjutian@users.noreply.github.com
  location: China
  summary: >-
    独立开发者，关注 AI 智能体、开发者工具与个人知识管理。喜欢把想法做成可运行、可验证的开源项目，
    目前在做 AI 编辑器、代码智能体、多智能体协作与知识星图方向的东西。

  social_networks:
    - network: GitHub
      username: fengjutian

