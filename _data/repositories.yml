# 仓库页的唯一数据源：_pages/repositories.md 完全由本文件驱动。
# 新增/下线项目只改这里，页面上的计数、分类、语言标签会自动同步。
#
# github_users / repo_description_lines_max 由 al-folio 主题的仓库卡片
# (repository/repo.liquid) 读取，删除会让主题自带的仓库渲染功能失效。

github_users:
